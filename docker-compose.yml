services:
  quiz-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: quiz-platform
    ports:
      - "3010:3010"
    volumes:
      - ./platform/api/tmp:/app/platform/api/tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
